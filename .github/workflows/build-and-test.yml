name: Build and test

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore WorkNotes.sln

      - name: Build release configuration
        run: dotnet build WorkNotes.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test WorkNotes.sln --configuration Release --no-build --no-restore --verbosity normal

      - name: Publish win-x64 executable
        run: dotnet publish WorkNotes/WorkNotes.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $exe = "publish\WorkNotes.exe"
          if (-not (Test-Path $exe)) { throw "Expected packaged executable not found: $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          try {
            if ($p.HasExited) { throw "WorkNotes.exe exited immediately (code $($p.ExitCode))" }
            Write-Output "Packaged executable launched and stayed running (pid $($p.Id))"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkNotes-win-x64
          path: publish/
          retention-days: 30
