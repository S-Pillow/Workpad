name: Build and test

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore WorkNotes.sln

      - name: Build release configuration
        run: dotnet build WorkNotes.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test WorkNotes.sln --configuration Release --no-build --no-restore --verbosity normal

      - name: Publish win-x64 executable
        run: dotnet publish WorkNotes/WorkNotes.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkNotes-win-x64
          path: publish/
          retention-days: 30
