name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore WorkNotes.sln

      - name: Build release configuration
        run: dotnet build WorkNotes.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test WorkNotes.sln --configuration Release --no-build --no-restore --verbosity normal
